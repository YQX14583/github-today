name: Update GitHub Today

on:
  schedule:
    - cron: "7 7 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate today's articles
        run: npm run update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_BASE_URL: https://api.deepseek.com
          AI_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          AI_MODEL: deepseek-v4-flash

      - name: Commit today's content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/today.json data/article-cache.json
          if git diff --cached --quiet; then
            echo "Today is already up to date."
          else
            git commit -m "content: update GitHub Today $(date +%F)"
            git push
          fi

      - name: Deploy today's content
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          install -m 600 /dev/null ~/.ssh/github_today
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/github_today
          ssh-keyscan -H 8.217.181.84 >> ~/.ssh/known_hosts
          scp -i ~/.ssh/github_today data/today.json github-today@8.217.181.84:/opt/github-today/data/today.next.json
          ssh -i ~/.ssh/github_today github-today@8.217.181.84 \
            'mv /opt/github-today/data/today.next.json /opt/github-today/data/today.json'
